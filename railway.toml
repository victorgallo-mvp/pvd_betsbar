[build]
builder = "RAILPACK"
buildCommand = "pnpm --filter @pdv/shared run build && pnpm --filter api exec prisma generate && pnpm --filter api run build"

[deploy]
# O seed NÃO roda mais no start: ele recriava produtos de demonstração apagados pelos clientes.
# Para popular um banco novo, rodar manualmente: pnpm --filter api run db:seed
startCommand = "pnpm --filter api exec prisma db push && pnpm --filter api run start"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
